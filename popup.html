<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Music Jam</title>
  <style>
    :root {
      --ytm-jam-bg: #09090b;
      --ytm-jam-surface: #121214;
      --ytm-jam-surface-hover: #1e1e24;
      --ytm-jam-border: rgba(255, 255, 255, 0.1);
      --ytm-jam-accent: #ff0033;
      --ytm-jam-accent-hover: #e6002e;
      --ytm-jam-accent-soft: rgba(255, 0, 51, 0.15);
      --ytm-jam-text-main: #ffffff;
      --ytm-jam-text-muted: #a1a1aa;
      --ytm-jam-green: #22c55e;
      --ytm-jam-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 360px;
      min-height: 520px;
      background: var(--ytm-jam-bg);
      color: var(--ytm-jam-text-main);
      font-family: var(--ytm-jam-font);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body::-webkit-scrollbar {
      width: 6px;
    }

    body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .header {
      padding: 14px 16px;
      background: var(--ytm-jam-surface);
      border-bottom: 1px solid var(--ytm-jam-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .jam-badge {
      font-size: 10px;
      font-weight: 800;
      background: var(--ytm-jam-accent);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .status-indicator {
      font-size: 11px;
      color: var(--ytm-jam-text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #71717a;
      transition: all 0.3s ease;
    }

    .status-dot.online {
      background: var(--ytm-jam-green);
      box-shadow: 0 0 6px var(--ytm-jam-green);
    }

    .content {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      min-height: 440px;
    }

    .card {
      background: var(--ytm-jam-surface);
      border: 1px solid var(--ytm-jam-border);
      border-radius: 10px;
      padding: 12px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--ytm-jam-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--ytm-jam-border);
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input:focus {
      border-color: var(--ytm-jam-accent);
    }

    .btn-primary {
      width: 100%;
      background: var(--ytm-jam-accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--ytm-jam-accent-hover);
    }

    .btn-secondary {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--ytm-jam-border);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--ytm-jam-text-muted);
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--ytm-jam-border);
    }

    .divider span {
      padding: 0 8px;
    }

    /* Room View */
    .room-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px dashed var(--ytm-jam-border);
    }

    .room-code {
      font-size: 18px;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: 2px;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--ytm-jam-border);
      color: #fff;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .copy-btn.copied {
      background: var(--ytm-jam-green);
      border-color: var(--ytm-jam-green);
    }

    .now-playing {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .now-playing-art {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #27272a;
    }

    .now-playing-info {
      flex: 1;
      overflow: hidden;
    }

    .now-playing-title {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .now-playing-artist {
      font-size: 11px;
      color: var(--ytm-jam-text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }

    /* Participants */
    .participants-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 120px;
      overflow-y: auto;
    }

    .participant-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff0033, #7928ca);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
    }

    .participant-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge-host {
      font-size: 9px;
      background: #eab308;
      color: #000;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 4px;
    }

    /* Queue */
    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
    }

    .queue-thumb {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      object-fit: cover;
      background: #27272a;
    }

    .queue-meta {
      flex: 1;
      overflow: hidden;
    }

    .queue-title {
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .queue-artist {
      font-size: 10px;
      color: var(--ytm-jam-text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--ytm-jam-text-muted);
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      font-size: 12px;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .icon-btn.remove-btn:hover {
      color: #ef4444;
    }

    .btn-leave {
      width: 100%;
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-leave:hover {
      background: #ef4444;
      color: #fff;
    }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--ytm-jam-border);
      font-size: 12px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3f3f46;
      transition: .3s;
      border-radius: 18px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    .switch input:checked + .slider {
      background-color: var(--ytm-jam-accent);
    }

    .switch input:checked + .slider:before {
      transform: translateX(16px);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .settings-panel {
      background: #18181b;
      border-bottom: 1px solid var(--ytm-jam-border);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .settings-panel.hidden {
      display: none;
    }

    .settings-preset-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--ytm-jam-border);
      color: #e4e4e7;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .settings-preset-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .settings-save-btn {
      background: var(--ytm-jam-accent);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .settings-save-btn:hover {
      background: var(--ytm-jam-accent-hover);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">
      <span>🎧 YTM Jam</span>
      <span class="jam-badge">V1.0</span>
    </div>
    <div class="header-actions">
      <div class="status-indicator">
        <span id="socket-dot" class="status-dot"></span>
        <span id="socket-status-text">Connecting...</span>
      </div>
      <button id="settings-toggle-btn" class="icon-btn" title="Server Settings" style="font-size: 13px; padding: 4px 6px;">⚙️</button>
    </div>
  </div>

  <div id="settings-panel" class="settings-panel hidden">
    <div class="card-title" style="margin-bottom: 0;">Server Settings</div>
    <p style="font-size: 11px; color: var(--ytm-jam-text-muted);">Sync Server WebSocket URL (Render / Cloud or Localhost):</p>
    <input type="text" id="server-url-input" class="input" style="font-size: 12px; padding: 7px 10px;" placeholder="wss://your-app.onrender.com" />
    <div style="display: flex; gap: 6px;">
      <button id="server-preset-local" class="settings-preset-btn" type="button">Localhost</button>
      <button id="server-save-btn" class="settings-save-btn" type="button">Save & Reconnect</button>
    </div>
    <div style="font-size: 10px; color: #71717a; display: flex; justify-content: space-between;">
      <span>Current: <span id="active-server-url-text" style="color: #d4d4d8;">ws://localhost:8080</span></span>
      <span id="server-save-msg" style="color: #22c55e;"></span>
    </div>
  </div>

  <div class="content" id="app-root">
    <!-- Rendered dynamically by popup.js -->
  </div>

  <script src="popup.js"></script>
</body>
</html>
